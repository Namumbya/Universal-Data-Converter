[project]
name = "universal-data-converter"
version = "0.1.0"
description = "Convert CSV, Excel, JSON, XML, PDF, and Markdown in the browser"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "fpdf2>=2.8.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2,<4",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1.2",
    "streamlit>=1.39,<2",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
